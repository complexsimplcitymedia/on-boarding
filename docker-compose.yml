services:
  onboarding:
    image: ghcr.io/complexsimplcitymedia/on-boarding:latest
    container_name: wolf-onboarding
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE=https://api.wolflogic-ai.com
      - VITE_AUTH0_DOMAIN=wolflogic-ai.us.auth0.com
      - VITE_AUTH0_CLIENT_ID=XwEDQX2h1lGRbcQek1OTodDdPmgI8Sl7
      - VITE_AUTH0_AUDIENCE=https://api.wolflogic-ai.com
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onboarding.rule=Host(`onboarding.wolflogic-ai.com`)"
      - "traefik.http.routers.onboarding.entrypoints=websecure"
      - "traefik.http.routers.onboarding.tls.certresolver=letsencrypt"
