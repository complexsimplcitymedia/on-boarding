services:
  onboarding:
    image: ghcr.io/complexsimplcitymedia/on-boarding:latest
    container_name: wolf-onboarding
    restart: unless-stopped
    ports:
      - "3300:80"
    environment:
      # Values pulled from host environment or .env file — never hardcode here
      - VITE_API_BASE=${VITE_API_BASE:-https://api.wolflogic-ai.com}
      - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN:-wolflogic-ai.us.auth0.com}
      - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}
      - VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE:-https://api.wolflogic-ai.com}
      - VITE_WOLF_JWT=${VITE_WOLF_JWT}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onboarding.rule=Host(`onboarding.wolflogic-ai.com`)"
      - "traefik.http.routers.onboarding.entrypoints=websecure"
      - "traefik.http.routers.onboarding.tls.certresolver=letsencrypt"
